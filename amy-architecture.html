<title>Amy Architecture</title>
<style>
:root {
  --bg: #f0f1f6;
  --surface: #ffffff;
  --border: #ced2e0;
  --text: #161926;
  --muted: #7a80a0;
  --blue: #3d6cf0;
  --amber: #d4881c;
  --green: #2d9e6b;
  --purple: #7c54d4;
  --teal: #1e8a7a;
  --new: #e05060;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c0e14;
    --surface: #13161f;
    --border: #242840;
    --text: #dde0f0;
    --muted: #555c80;
    --blue: #5b8af5;
    --amber: #e8a24a;
    --green: #4dba7f;
    --purple: #9b7ae8;
    --teal: #3dbdaa;
    --new: #f06070;
  }
}
:root[data-theme="dark"] {
  --bg: #0c0e14;
  --surface: #13161f;
  --border: #242840;
  --text: #dde0f0;
  --muted: #555c80;
  --blue: #5b8af5;
  --amber: #e8a24a;
  --green: #4dba7f;
  --purple: #9b7ae8;
  --teal: #3dbdaa;
  --new: #f06070;
}

body {
  background: var(--bg);
  color: var(--text);
  margin: 0;
  padding: 2rem 1.5rem 3rem;
  min-height: 100vh;
}

header { margin-bottom: 2rem; }

h1 {
  font-size: 1.05rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 0 0 0.25rem;
}

.subtitle {
  font-size: 0.78rem;
  color: var(--muted);
  margin: 0;
  font-family: ui-monospace, 'SF Mono', monospace;
}

figure { margin: 0; overflow-x: auto; }
svg { max-width: 100%; height: auto; display: block; }

figcaption {
  margin-top: 1.5rem;
  font-size: 0.78rem;
  color: var(--muted);
  font-family: ui-monospace, 'SF Mono', monospace;
  line-height: 1.6;
}

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 1rem 2rem;
  margin-top: 1rem;
  font-size: 0.75rem;
  font-family: ui-monospace, 'SF Mono', monospace;
  color: var(--muted);
}
.legend-item { display: flex; align-items: center; gap: 0.4rem; }
.legend-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
</style>
